name: Licensing API static checks

on:
  push:
    branches:
      - feature/licensing-v2-secure
    paths:
      - "licensing-api/**"
      - ".github/workflows/licensing-api-check.yml"
  pull_request:
    branches:
      - main
      - feature/licensing-v2-secure
    paths:
      - "licensing-api/**"
      - ".github/workflows/licensing-api-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install key utility dependency
        run: python -m pip install "cryptography>=42,<48"
      - name: Check Worker JavaScript syntax
        run: node --check licensing-api/src/index.js
      - name: Validate D1 migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("licensing-api/migrations/0001_initial.sql").read_text(encoding="utf-8"))
          print("D1 schema SQL parsed successfully.")
          PY
      - name: Run signing-key backup tests
        run: python -m unittest discover -s licensing-api/tests -v
      - name: Compile key utility
        run: python -m py_compile licensing-api/tools/generate_signing_key.py
