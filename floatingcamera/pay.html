<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080d17">
  <title>Secure checkout · Floating Camera · L30 Technology</title>
  <style>
    :root{color-scheme:dark;--bg:#080d17;--card:#111b2c;--line:#29374d;--ink:#f5f9ff;--muted:#a9b7cd;--cyan:#68e5f3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,560px);padding:34px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:center;box-shadow:0 20px 70px #0005}
    .mark{width:58px;height:58px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:#173348;color:var(--cyan);font-size:27px}
    h1{font-size:26px;line-height:1.2;margin:0 0 12px}
    p{color:var(--muted);margin:0}
    #status{margin-top:18px;min-height:52px;padding:14px;border:1px solid var(--line);border-radius:12px}
    a{display:inline-block;margin-top:22px;color:var(--cyan);text-decoration:none}
    .small{font-size:12px;margin-top:22px}
  </style>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="./paddle-config.js"></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L30</div>
    <h1>Secure Floating Camera checkout</h1>
    <p>Your payment is processed securely by Paddle. Your camera video is never sent to the payment provider.</p>
    <div id="status" role="status" aria-live="polite">Preparing secure checkout…</div>
    <a href="./">Return to Floating Camera</a>
    <p class="small">L30 Technology · Floating Camera Pro</p>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const transactionId = new URLSearchParams(window.location.search).get("_ptxn");
      const token = window.L30_PADDLE_CLIENT_TOKEN;

      if (!transactionId) {
        status.textContent = "No active payment link was found. Return to the product page and choose a plan.";
        return;
      }
      if (!token || token.startsWith("REPLACE_")) {
        status.textContent = "Checkout is not configured yet. Please contact L30 Technology.";
        return;
      }
      if (!window.Paddle) {
        status.textContent = "The secure checkout could not be loaded. Check your connection and try again.";
        return;
      }

      try {
        if (token.startsWith("test_")) window.Paddle.Environment.set("sandbox");
        window.Paddle.Initialize({
          token,
          checkout: {
            settings: {
              displayMode: "overlay",
              theme: "dark",
              locale: "en"
            }
          },
          eventCallback: (event) => {
            if (event?.name === "checkout.completed") {
              status.textContent = "Checkout submitted. We are waiting for final payment confirmation before activating your license.";
            } else if (event?.name === "checkout.closed") {
              status.textContent = "Checkout closed. You may reopen your payment link or contact support.";
            }
          }
        });
        // Paddle.js detects the _ptxn query parameter and opens the corresponding transaction.
      } catch (error) {
        console.error("Paddle initialization failed", error);
        status.textContent = "Secure checkout could not be initialized. Please contact support.";
      }
    })();
  </script>
</body>
</html>
